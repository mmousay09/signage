name: Android player

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Publish the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk signage-player.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest signage-player.apk \
            --title "مشغّل الشاشات لأندرويد" \
            --notes "آخر نسخة من تطبيق مشغّل الشاشات. نزّل الملف signage-player.apk وثبّته على الشاشة." \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: signage-player
          path: signage-player.apk
